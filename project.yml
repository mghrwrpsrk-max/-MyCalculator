name: GlassCalc
options:
  bundleIdPrefix: com.custom
targets:
  GlassCalc:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - CalculatorApp.swift
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: GlassCalc
        CFBundleName: GlassCalc
        CFBundleExecutable: GlassCalc
        CFBundleIdentifier: com.custom.glasscalc
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        CFBundleIconFiles:
          - AppIcon60x60
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
