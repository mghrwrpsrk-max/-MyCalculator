name: GlassCalc
options:
  bundleIdPrefix: com.custom
targets:
  GlassCalc:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - CalculatorApp.swift
      - path: Icon.png
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Glass Calc"
        CFBundleName: "GlassCalc"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundleIconFiles:
          - Icon.png
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
