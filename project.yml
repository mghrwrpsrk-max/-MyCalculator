name: GlassCalc
options:
  bundleIdPrefix: com.custom
targets:
  GlassCalc:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - CalculatorApp.swift
      - Assets.xcassets
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.custom.glasscalc
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "Glass Calc"
        CFBundleName: "GlassCalc"
        CFBundleExecutable: "GlassCalc"
        CFBundleIdentifier: "com.custom.glasscalc"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        CFBundlePackageType: "APPL"
        CFBundleInfoDictionaryVersion: "6.0"
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities:
          - arm64
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
