name: Build iOS IPA

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Sign IPA
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project GlassCalc.xcodeproj -scheme GlassCalc -sdk iphoneos -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          sips -s format png -z 120 120 /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns --out build/Build/Products/Release-iphoneos/GlassCalc.app/AppIcon60x60@2x.png
          sips -s format png -z 180 180 /System/Library/CoreServices/CoreTypes.bundle/Contents/Resources/GenericApplicationIcon.icns --out build/Build/Products/Release-iphoneos/GlassCalc.app/AppIcon60x60@3x.png
          codesign --force --deep --sign - build/Build/Products/Release-iphoneos/GlassCalc.app
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/GlassCalc.app Payload/
          zip -qry GlassCalc.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GlassCalc-IPA
          path: GlassCalc.ipa
